<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            padding: 10px 20px;
            border: 1px solid rgb(177, 175, 175);
            width: 200px;
            height: 200px;
            border-radius: 50px;
        }
        button{
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background-color: red;
            color: white;
            margin-top: 10px;
        }
        .btnDark{
            background-color: rgb(85, 85, 85);
        }
        .darkMode{
            background-color: rgb(36, 36, 36);
            color:  white;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h1>Title</h1>
        <p>Subtitle</p>
        <button>Button</button>
    </div>
    <button class="dark">Dark mode</button>
    <script src="script.js"></script>
</body>
</html>

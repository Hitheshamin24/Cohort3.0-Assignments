<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Clone</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
      integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <div class="logo">
            <img
              src="https://a.slack-edge.com/38f0e7c/marketing/img/nav/slack-salesforce-logo-nav-black.png"
              alt=""
            />
          </div>

          <ul class="nav-links">
            <li>Features <i class="ri-arrow-down-s-line"></i></li>
            <li>Solutions <i class="ri-arrow-down-s-line"></i></li>
            <li>Enterprise</li>
            <li>Resources <i class="ri-arrow-down-s-line"></i></li>
            <li>Pricing</li>
          </ul>
        </div>

        <div class="nav-right">
          <span class="search"><i class="ri-search-line"></i></span>
          <a href="#">Sign in</a>

          <button class="outline-btn">REQUEST A DEMO</button>

          <button class="purple-btn">GET STARTED</button>
        </div>
      </nav>
    </header>

    <section class="hero">
      <h1>
        All your people and AI agents
        <br />
        working together.
      </h1>

      <p>Slack connects your team. Slackbot multiplies what they can do.</p>

      <div class="hero-buttons">
        <button class="purple-btn hero-btn">GET STARTED</button>

        <button class="outline-btn hero-btn">FIND YOUR SUBSCRIPTION →</button>
      </div>

      <div class="companies">
        <span>Trusted by top teams</span>

        <div class="logos">
          <img
            src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-gm-small.png"
          />
          <img
            src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-openai-small.png"
          />
          <img
            src="https://a.slack-edge.com/a4c4a15/marketing/img/homepage/true-prospects/revamp-exp/logos/logo-target-small.png"
          />
          <img
            src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-paramount-small.png"
          />
          <img
            src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-stripe-small.png"
          />
          <img
            src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-ibm-small.png"
          />
        </div>
      </div>
    </section>

    <section class="workspace-showcase">

      <div class="workspace-container">
        <img src="./assets/slackbot.png" alt="" />
      </div>

      <div class="chips">
        <button>Ask Slackbot 🤖</button>
        <button>Plan launches 🚀</button>
        <button>Run projects 📋</button>
        <button class="active">Chat with clients 💬</button>
        <button>Automate tasks ⚡</button>
      </div>
    </section>
  </body>
</html>

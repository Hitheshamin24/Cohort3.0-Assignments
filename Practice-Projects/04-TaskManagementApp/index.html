<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <h1>Task Manager</h1>
        <button class="btn" id="create">Create Task</button>
      </nav>
      <div class="task"></div>

      <div class="form">
        <div class="close">
          <div></div>
          <h2>X</h2>
        </div>
        <form action="">
          <input type="text" placeholder="Task title" />
          <select id="category">
            <option value="Development">Development</option>
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Health">Health & Fitness</option>
            <option value="Personal">Personal</option>
            <option value="Finance">Finance</option>
            <option value="Goals">Goals</option>
            <option value="Dance">Dance</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Family">Family</option>
            <option value="Reading">Reading</option>
            <option value="Food">Food</option>
            <option value="Events">Events</option>
          </select>
          <select name="" id="Status">
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
          </select>
          <button id="createTask">Create Task</button>
        </form>
      </div>
    </main>
    <section class="demo">
      <h2>DOM Concepts Demo</h2>

      <button id="attributeDemo">Attribute Methods</button>

      <button id="propertyDemo">Attributes vs Properties</button>

      <input id="demoInput" value="Original Value" />
    </section>
    <script src="script.js"></script>
  </body>
</html>

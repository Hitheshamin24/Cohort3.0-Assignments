<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard">
      <img
        id="dashboard-img"
        src="https://img.magnific.com/free-photo/full-moon-shines-tranquil-lake-night_9975-33131.jpg?semt=ais_hybrid&w=740&q=80"
        alt=""
      />
      <div class="overlay"></div>
      <div class="feature-view">
        <div class="time-display">
          <h1>Productivity Planner</h1>
          <h3 id="timer">Time-</h3>
          <h3 id="weather">Weather</h3>
        </div>
        <div class="cards">
          <div id="todo-list" class="card">
            <div class="card-img">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTj2_t47EzcFUhO7nNAnHA4UtkxJB36YJuE9zDejn6lHg&s=10"
                alt=""
              />
              <h4>To Do list</h4>
            </div>
          </div>
          <div class="card">
            <div class="card-img">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT41rjJo5N01YgFt3jPtu0gaFG65S0Cdb0dm517AoO5AA&s=10"
                alt=""
              />
              <h4>Daily Planner</h4>
            </div>
          </div>
          <div id="motivation-card" class="card">
            <div class="card-img">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRY4iCVZujJc27jE3ZaLRgG7KJhQadrbgM7sUmD5zgM4Q&s=10"
                alt=""
              />
              <h4>Motivation Quote</h4>
            </div>
          </div>
          <div class="card">
            <div class="card-img">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfEse55dY0boPkxKBIRdkezAc0dW6fGuqADYx30P_gNw&s=10"
                alt=""
              />
              <h4>Pomodoro Timer</h4>
            </div>
          </div>
          <div class="card">
            <div class="card-img">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQivQO_AwlZaarYhWExYDHMttzb3j1owYnKYWe31mHMTg&s=10"
                alt=""
              />
              <h4>Daily Goals</h4>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="motivation-card-view">
      <nav>
        <button id="close-motivation-card">Close</button>
      </nav>
      <div class="motivation">
        <div class="quotes">
          <h2>Quote of the Day</h2>
          <p id="quote">
            Success is not final, failure is not fatal: it is the courage to
            continue that counts.
          </p>
          <p id="author">- Winston Churchill</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

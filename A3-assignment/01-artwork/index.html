<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Work Cards</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="explore-section">
      <div class="top-bar">
        <h2>Explore Art Work</h2>
        <a href="#">See All</a>
      </div>

      <div class="cards-wrapper">
        <!-- CARD 1 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/monocular.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Monocular</h3>
              <span>54.8k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/hornsmask.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Horns Mask</h3>
              <span>32.4k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/lightmoon.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Light Moon</h3>
              <span>86.8k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 4 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/skullwire.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Skull Wire</h3>
              <span>78.9k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 5 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/spiderman.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Spiderman</h3>
              <span>24.8k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 6 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/deadpool.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>DeadPool</h3>
              <span>50.7k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 7 -->
        <div class="card">
          <div class="img-box">
            <img src="assets/whiteeye.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>White Eye</h3>
              <span>45.7k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>

        <!-- CARD 8 -->
        <div class="card">
          <div class="img-box">
            <img src="./assets/plasticspinal.jfif" alt="" />
          </div>

          <div class="card-info">
            <div class="info-row">
              <h3>Plastic Spinal</h3>
              <span>98.6k ♡</span>
            </div>

            <button>Place Bid</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>

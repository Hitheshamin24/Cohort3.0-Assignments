<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game Landing Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />
  </head>
  <body>
    <div class="main">
      <nav class="navbar">
        <div class="logo">
          <img src="images/logo.png" alt="" />
        </div>
        <div class="nav-links">
          <a href="#">About</a>
          <a href="#" class="active">Watch now</a>
          <a href="#">Actors</a>
          <a href="#">Contact</a>
        </div>
        <div class="menu">
          <i class="ri-menu-3-line"></i>
        </div>
      </nav>
      <section class="hero">
        <div class="hero-left">
          <div class="title">
            <img src="assets/title.png" alt="" />
          </div>
          <p class="desc">
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang
          </p>
          <p class="season">Season 1: 9 Episodes</p>
          <div class="buttons">
            <button class="play-btn">
              <i class="ri-play-circle-fill"></i>
              Play Now
            </button>
            <button class="trailer-btn">
              <i class="ri-play-mini-line"></i>
              Watch Trailer
            </button>
          </div>
        </div>
        <div class="scroll">
          <span>SCROLL</span>
          <div class="line"></div>
        </div>
        <div class="hero-right">
          <img src="assets/guard.png" alt="" class="guard" />
          <div class="socials">
            <i class="ri-twitter-line"></i>
            <i class="ri-instagram-line"></i>
            <i class="ri-facebook-line"></i>
          </div>
        </div>
      </section>
      <h1 class="bg-text-left">GAME</h1>
      <h1 class="bg-text-right">SQUID</h1>
      <div class="cards">
        <div class="card">
          <img src="assets/squidgame-1.png" alt="" />
          <div class="overlay">
            <i class="ri-play-circle-fill"></i>
          </div>
        </div>
        <div class="card">
          <img src="assets/squidgame-2.png" alt="" />
          <div class="overlay">
            <i class="ri-play-circle-fill"></i>
          </div>
        </div>
        <div class="card">
          <img src="assets/squidgame-3.png" alt="" />
          <div class="overlay">
            <i class="ri-play-circle-fill"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
